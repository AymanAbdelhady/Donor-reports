<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin dashboard · Donor Report Studio</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="top">
    <button type="button" class="menu-btn" id="menuBtn" aria-label="Menu"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <img id="topLogo" class="top-logo" src="brand/logo-white.png" alt="">
    <div class="top-title"><b id="topTitle">Admin dashboard</b><span id="topOrg"></span></div>
    <a class="ghost" href="./">Open Studio</a>
    <div class="me"><button type="button" id="meBtn" class="me-btn"></button>
      <div class="me-menu" id="meMenu" hidden><a href="admin#account">My account</a><button type="button" id="signOut">Sign out</button></div>
    </div>
  </header>
  <div class="shell">
    <nav class="side" id="side">
      <a href="admin#overview" data-s="overview"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Overview</a>
      <div class="grp">People</div>

      <div class="grp">Settings</div>
      <a href="admin#branding" data-s="branding"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.3"/><circle cx="12" cy="7.5" r="1.3"/><circle cx="16" cy="10" r="1.3"/><path d="M12 21c-1.5 0-2-1-2-2s1-2 2.5-2H15a3 3 0 0 0 3-3"/></svg>Branding</a>

      <a href="admin#languages" data-s="languages"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>Languages</a>

    <main id="main" class="main" aria-live="polite"></main>
  </div>
  <dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
  <div class="toast" id="toast" hidden></div>
  <script src="admin.js" type="module"></script>

</html>
